[workspace]
resolver = "2"
members = [
    "bloader_shared",
    "bootloader",
    "kernel",
    "fs/bfs",
    "userspace/init",
    "userspace/shell",
    "userspace/coreutils",
    "userspace/bpt",
    "userspace/bnet",
    "userspace/btext",
    "compat/win32",
    "compat/macho",
    "compat/elf",
    "drivers/net",
    "drivers/fs",
    "utils/logger",
    "utils/config",
]
exclude = []

[workspace.dependencies]
# Core
rustc_version = "0.4"
bootloader = { version = "0.12", features = ["uefi"] }
x86_64 = "0.15"
volatile = "0.4"
spin = "0.9"
bitflags = "2.0"
lazy_static = { version = "1.4", features = ["spin_no_std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Filesystem
byteorder = "1.5"
crc32fast = "1.3"
uuid = { version = "=1.6.0", default-features = false, features = ["serde"] }

# Async
alloc = { version = "1.0", features = ["alloc"] }
compiler_builtins = { version = "0.1", features = ["mem"] }

# Host userspace tools (bpt, bnet)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
anyhow = "1.0"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
crossterm = { version = "0.27", features = ["use-dev-tty"] }
url = "2.5"
toml = "0.8"

# Logging
log = "0.4"
uart_16550 = "0.3"

# Testing
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true