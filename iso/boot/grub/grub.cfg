set timeout=5
set default=0
menuentry "bOS 0.1 (x86_64)" {
  multiboot2 /boot/kernel.bin loglevel=debug console=serial
  module2 /boot/initrd.img initrd
  boot
}
menuentry "bOS 0.1 (safe mode, no SMP)" {
  multiboot2 /boot/kernel.bin loglevel=trace nosmp nomodeset
  module2 /boot/initrd.img initrd
  boot
}
