# default: host target. UEFI/kernel builds pass --target explicitly.
[build]
# target = "x86_64-unknown-uefi"
rustflags = []
rustc-wrapper = "scripts/firmware-rustc.sh"

[env]
CC_x86_64_unknown_none = "clang"
CFLAGS_x86_64_unknown_none = "-ffreestanding -fPIC -mno-red-zone -DRING_CORE_NOSTDLIBINC=1"
