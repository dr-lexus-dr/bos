name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run host tests
        run: bash scripts/test-host.sh

  qemu:
    name: Build and boot in QEMU
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly and firmware targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          components: rust-src
          targets: x86_64-unknown-uefi, x86_64-unknown-none

      - name: Install QEMU, OVMF and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils qemu-system-x86 ovmf tar

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release ESP
        run: bash scripts/build.sh --release

      - name: Smoke test
        run: python3 scripts/test-qemu.py

      - name: RAM matrix (512M, 1G, 4G)
        run: python3 scripts/test-boot-matrix.py

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: target/qemu-logs
          if-no-files-found: ignore

      - name: Upload release ESP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bos-esp
          path: target/esp
          if-no-files-found: error
