name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: Graphical live disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: userspace/browser/go.sum
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          targets: x86_64-unknown-none, x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf clang binutils openssl dosfstools python3-pil
      - run: bash scripts/build.sh --live
      - run: python3 scripts/test-live.py
      - run: python3 scripts/test-live.py --uefi --nic e1000
      - run: python3 scripts/test-live.py --nic e1000e
      - run: python3 scripts/test-live-storage.py
      - run: python3 scripts/test-browser.py --uefi
      - run: cargo run --release --locked -p bos_web_runtime --example check -- target/browser.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bos-live-disk
          path: target/live/bos-live.img
          if-no-files-found: error

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run host tests
        run: bash scripts/test-host.sh

  qemu:
    name: QEMU (${{ matrix.storage }})
    strategy:
      fail-fast: false
      matrix:
        storage: [virtio, ahci, nvme]
    env:
      BOS_STORAGE: ${{ matrix.storage }}
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: userspace/browser/go.sum

      - name: Install Rust nightly and firmware targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          components: rust-src
          targets: x86_64-unknown-uefi, x86_64-unknown-none

      - name: Install QEMU, OVMF and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang qemu-system-x86 ovmf tar pkg-config libselinux1-dev libacl1-dev libattr1-dev libcap-dev libsystemd-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release ESP
        run: bash scripts/build.sh --release

      - name: Native bSH editing
        run: python3 scripts/test-bsh.py

      - name: Smoke test
        run: python3 scripts/test-qemu.py

      - name: NVMe namespace and DMA matrix
        if: matrix.storage == 'nvme'
        run: python3 scripts/test-nvme.py

      - name: RAM matrix (512M, 1G, 4G)
        run: python3 scripts/test-boot-matrix.py

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs-${{ matrix.storage }}
          path: target/qemu-logs
          if-no-files-found: ignore

      - name: Upload release ESP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bos-esp-${{ matrix.storage }}
          path: target/esp
          if-no-files-found: error
